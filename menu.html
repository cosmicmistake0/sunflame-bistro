<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Thasadith:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Calligraffitti&display=swap"
      rel="stylesheet"
    />
    <script src="menu.js" type="module"></script>
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <nav>
        <div class="menu">
          <a href=""><img src="icons/menu-svgrepo-com.svg" alt="" /> </a>
        </div>
        <div class="logo"><img src="images/Sunflame Logo.png" alt="" /></div>
        <div class="cart">
          <a href=""
            ><img src="icons/cart-shopping-svgrepo-com.svg" alt=""
          /></a>
        </div>
      </nav>
    </header>
    <main>
      <div class="hero-menu">
        <div class="hero-menu-text"><p>Menu</p></div>
      </div>
      <div class="menu-container">
        <div class="tabs">
          <button class="cta-green" id="all">All</button>
          <button class="cta-green" id="featured">Featured</button>
          <button class="cta-green" id="food">Food</button>
          <button class="cta-green" id="drinks">Drinks</button>
          <button class="cta-green" id="dessert">Dessert</button>
          <button class="cta-green" id="snacks">Snacks</button>
        </div>
        <div class="menu-items-container">
          <div class="menu-card">
            <div class="menu-image">
              <img src="menu img/Burger.jfif" />
            </div>

            <div class="menu-text">
              <div class="menu-name">
                <p>random shit</p>
              </div>

              <div class="menu-price">Price: ₦1000</div>

              <div class="menu-cta">
                <button class="cta-gold">Add to Cart</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
